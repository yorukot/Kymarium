services:
  timescale:
    image: timescale/timescaledb:latest-pg17
    container_name: kymarium-timescale
    environment:
      POSTGRES_DB: ${DB_NAME:-kymarium}
      POSTGRES_USER: ${DB_USER:-kymarium}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kymarium-this-is-a-really-long-password}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: kymarium-dragonfly
    command: ["--default_lua_flags=allow-undeclared-keys"]
    environment:
      - DFLY_requirepass=${REDIS_PASSWORD:-kymarium-dragonfly-password}
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: kymarium-backend
    environment:
      APP_NAME: ${APP_NAME:-kymarium}
      APP_ENV: ${APP_ENV:-dev}
      APP_MACHINE_ID: ${APP_MACHINE_ID:-1}
      APP_PORT: ${APP_PORT:-8000}
      APP_REGION: ${APP_REGION:-TW-Taipei}
      APP_REGIONS: ${APP_REGIONS:-TW-Taipei,US-San Francisco}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-localhost:5173}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://api.kymarium.com/api}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-thisisasecret}

      DB_HOST: ${DB_HOST:-timescale}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-kymarium}
      DB_PASSWORD: ${DB_PASSWORD:-kymarium-this-is-a-really-long-password}
      DB_NAME: ${DB_NAME:-kymarium}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}

      REDIS_HOST: ${REDIS_HOST:-dragonfly}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-kymarium-dragonfly-password}

      OAUTH_STATE_EXPIRES_AT: ${OAUTH_STATE_EXPIRES_AT:-600}
      ACCESS_TOKEN_EXPIRES_AT: ${ACCESS_TOKEN_EXPIRES_AT:-900}
      REFRESH_TOKEN_EXPIRES_AT: ${REFRESH_TOKEN_EXPIRES_AT:-31536000}
      EMAIL_VERIFY_EXPIRES_AT: ${EMAIL_VERIFY_EXPIRES_AT:-900}

      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-example_user}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-password}
      SMTP_FROM: ${SMTP_FROM:-user@example.com}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-changeme-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-changeme-google-client-secret}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8000/api/auth/oauth/google/callback}
    depends_on:
      - timescale
      - dragonfly
    ports:
      - "8000:8000"

  website:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
        FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    container_name: kymarium-website
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  timescale_data:
  dragonfly_data:
